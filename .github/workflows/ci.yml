name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: scripts

  test-scripts:
    name: Test Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint test suite
        run: shellcheck tests/test.sh

      - name: Run script tests
        run: bash tests/test.sh

  test-install:
    name: Test Install Script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test install (latest)
        env:
          VERSION: latest
        run: |
          # sudo strips GITHUB_TOKEN (no -E) -> exercises the unauthenticated fallback path on purpose
          sudo bash scripts/install.sh
          kube-diff version

      - name: Test install (latest, authenticated)
        env:
          VERSION: latest
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # sudo -E preserves GITHUB_TOKEN -> exercises the authenticated version-lookup path
          sudo -E bash scripts/install.sh
          kube-diff version

  test-action-file:
    name: Test Action (file mode)
    runs-on: ubuntu-latest
    needs: [shellcheck, test-install]
    steps:
      - uses: actions/checkout@v7

      - name: Create test manifests
        run: |
          mkdir -p /tmp/test-manifests
          cat > /tmp/test-manifests/configmap.yaml << 'YAML'
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: test-config
            namespace: default
          data:
            key: value
          YAML

      - name: Setup kind cluster
        uses: helm/kind-action@v1

      - name: Apply test manifests
        run: kubectl apply -f /tmp/test-manifests/

      - name: Run kube-diff action
        id: diff
        uses: ./
        with:
          source: file
          path: /tmp/test-manifests/
          namespace: default
          output: markdown
          comment: 'false'

      - name: Verify no drift right after apply
        env:
          EXIT_CODE: ${{ steps.diff.outputs.exit-code }}
          HAS_CHANGES: ${{ steps.diff.outputs.has-changes }}
          RESULT: ${{ steps.diff.outputs.result }}
        run: |
          echo "${RESULT}"
          if [[ "${EXIT_CODE}" != "0" || "${HAS_CHANGES}" != "false" ]]; then
            echo "::error::expected exit-code=0 has-changes=false, got ${EXIT_CODE}/${HAS_CHANGES}"
            exit 1
          fi

      - name: Introduce drift
        run: kubectl patch configmap test-config -n default --type merge -p '{"data":{"key":"drifted"}}'

      - name: Run kube-diff action (drift)
        id: drift
        uses: ./
        with:
          source: file
          path: /tmp/test-manifests/
          namespace: default
          exit-code: 'true'
          comment: 'false'

      - name: Verify drift is reported
        env:
          EXIT_CODE: ${{ steps.drift.outputs.exit-code }}
          HAS_CHANGES: ${{ steps.drift.outputs.has-changes }}
        run: |
          if [[ "${EXIT_CODE}" != "0" || "${HAS_CHANGES}" != "true" ]]; then
            echo "::error::expected exit-code=0 (masked) has-changes=true, got ${EXIT_CODE}/${HAS_CHANGES}"
            exit 1
          fi

      - name: Run kube-diff action (bad path)
        id: broken
        continue-on-error: true
        uses: ./
        with:
          source: file
          path: /tmp/does-not-exist/
          comment: 'false'

      - name: Verify a kube-diff error fails the action
        env:
          OUTCOME: ${{ steps.broken.outcome }}
        run: |
          if [[ "${OUTCOME}" != "failure" ]]; then
            echo "::error::expected the action to fail on a bad path, got outcome=${OUTCOME}"
            exit 1
          fi

  test-action-helm:
    name: Test Action (helm mode)
    runs-on: ubuntu-latest
    needs: [shellcheck, test-install]
    steps:
      - uses: actions/checkout@v7

      - name: Setup kind cluster
        uses: helm/kind-action@v1

      - name: Create test chart
        run: |
          mkdir -p /tmp/test-chart/templates
          cat > /tmp/test-chart/Chart.yaml << 'YAML'
          apiVersion: v2
          name: test-chart
          version: 0.1.0
          YAML
          cat > /tmp/test-chart/values.yaml << 'YAML'
          replicas: 1
          image: nginx:1.25
          YAML
          cat > /tmp/test-chart/templates/deployment.yaml << 'YAML'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: test-app
          spec:
            replicas: {{ .Values.replicas }}
            selector:
              matchLabels:
                app: test
            template:
              metadata:
                labels:
                  app: test
              spec:
                containers:
                  - name: app
                    image: {{ .Values.image }}
          YAML

      - name: Run kube-diff action (helm)
        id: diff
        uses: ./
        with:
          source: helm
          path: /tmp/test-chart/
          release: test-release
          output: json
          comment: 'false'

      - name: Verify uninstalled release is reported as drift
        env:
          EXIT_CODE: ${{ steps.diff.outputs.exit-code }}
          HAS_CHANGES: ${{ steps.diff.outputs.has-changes }}
        run: |
          if [[ "${EXIT_CODE}" != "1" || "${HAS_CHANGES}" != "true" ]]; then
            echo "::error::expected exit-code=1 has-changes=true, got ${EXIT_CODE}/${HAS_CHANGES}"
            exit 1
          fi

  ci-result:
    name: CI Result
    if: always()
    needs: [shellcheck, test-scripts, test-install, test-action-file, test-action-helm]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.shellcheck.result }}" != "success" ]] || \
             [[ "${{ needs.test-scripts.result }}" != "success" ]] || \
             [[ "${{ needs.test-install.result }}" != "success" ]] || \
             [[ "${{ needs.test-action-file.result }}" != "success" ]] || \
             [[ "${{ needs.test-action-helm.result }}" != "success" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed"
